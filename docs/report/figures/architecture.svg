ight="105" fill="#eaf5f2" rx="12"/><text x="785" y="220" font-family="Arial, sans-serif" font-size="19" fill="#152d35" font-weight="700" text-anchor="start">Calibrated fusion</text><text x="785" y="246" font-family="Arial, sans-serif" font-size="15" fill="#62757b" font-weight="400" text-anchor="start">Availability / ambiguity gates</text><line x1="264" y1="195" x2="297" y2="195" stroke="#008b84" stroke-width="2"/><line x1="297" y1="144" x2="297" y2="332" stroke="#008b84" stroke-width="2"/><line x1="297" y1="144" x2="335" y2="144" stroke="#008b84" stroke-width="2"/><line x1="675" y1="144" x2="718" y2="144" stroke="#008b84" stroke-width="2"/><line x1="718" y1="144" x2="718" y2="332" stroke="#008b84" stroke-width="2"/><line x1="718" y1="242" x2="765" y2="242" stroke="#008b84" stroke-width="2"/><line x1="264" y1="195" x2="297" y2="195" stroke="#008b84" stroke-width="2"/><line x1="297" y1="144" x2="297" y2="332" stroke="#008b84" stroke-width="2"/><line x1="297" y1="238" x2="335" y2="238" stroke="#008b84" stroke-width="2"/><line x1="675" y1="238" x2="718" y2="238" stroke="#008b84" stroke-width="2"/><line x1="718" y1="144" x2="718" y2="332" stroke="#008b84" stroke-width="2"/><line x1="718" y1="242" x2="765" y2="242" stroke="#008b84" stroke-width="2"/><line x1="264" y1="195" x2="297" y2="195" stroke="#008b84" stroke-width="2"/><line x1="297" y1="144" x2="297" y2="332" stroke="#008b84" stroke-width="2"/><line x1="297" y1="332" x2="335" y2="332" stroke="#008b84" stroke-width="2"/><line x1="675" y1="332" x2="718" y2="332" stroke="#008b84" stroke-width="2"/><line x1="718" y1="144" x2="718" y2="332" stroke="#008b84" stroke-width="2"/><line x1="718" y1="242" x2="765" y2="242" stroke="#008b84" stroke-width="2"/><text x="910" y="333" font-family="Arial, sans-serif" font-size="18" fill="#152d35" font-weight="700" text-anchor="middle">Emotion scores / abstention</text><text x="910" y="362" font-family="Arial, sans-serif" font-size="15" fill="#62757b" font-weight="400" text-anchor="middle">Seven-class evidence</text><line x1="910" y1="295" x2="910" y2="311" stroke="#008b84" stroke-width="2"/><text x="44" y="430" font-family="Arial, sans-serif" font-size="17" fill="#62757b" font-weight="400" text-anchor="start">Streaming front end: VAD + face preparation + bounded scheduling.</text><text x="44" y="462" font-family="Arial, sans-serif" font-size="17" fill="#62757b" font-weight="400" text-anchor="start">Mundiscope roadmap: Sense (current research) → Remember → Express.</text><text x="44" y="494" font-family="Arial, sans-serif" font-size="15" fill="#62757b" font-weight="400" text-anchor="start">Memory, hardware deployment and robot expression are future integration goals.</text></svg>